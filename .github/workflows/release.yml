name: Release packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Package version (for example 1.2.3 or 1.2.3-rc.1)
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      MANUAL_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module .\scripts\packaging\Package.psm1
          if ($env:GITHUB_EVENT_NAME -eq 'release') {
            if (-not $env:RELEASE_TAG.StartsWith('v')) { throw 'Release tags must start with v (for example v1.2.3).' }
            $version = $env:RELEASE_TAG.Substring(1)
          } else {
            $version = $env:MANUAL_VERSION
          }
          $version = (Get-PackageVersion -Version $version).Version
          "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build, test, and package
        shell: powershell
        run: .\scripts\Build.ps1 -Test -Installer -Version $env:PACKAGE_VERSION

      - name: Test portable package and installer
        shell: powershell
        run: .\scripts\Test-Package.ps1 -Version $env:PACKAGE_VERSION -Installer

      - name: Save downloadable build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RepoBackup-${{ env.PACKAGE_VERSION }}-win-x64
          if-no-files-found: error
          path: |
            dist/RepoBackup-${{ env.PACKAGE_VERSION }}-win-x64-setup.exe
            dist/RepoBackup-${{ env.PACKAGE_VERSION }}-win-x64.zip
            dist/SHA256SUMS

      - name: Attach assets to GitHub Release
        if: github.event_name == 'release'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload $env:RELEASE_TAG "dist/RepoBackup-${env:PACKAGE_VERSION}-win-x64-setup.exe" "dist/RepoBackup-${env:PACKAGE_VERSION}-win-x64.zip" dist/SHA256SUMS --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
